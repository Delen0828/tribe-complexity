<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TRIBE · Analysis</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="brain.css">
  <script src="brain.js" defer></script>
</head>
<body>
  <header><a class="brand" href="./">TRIBE <span>/ Analysis</span></a><a href="./">Home</a></header>
  <main>
    <div class="brain-heading"><h1 id="report-title">Analysis</h1><a id="selection-link" hidden>Selection ↗</a></div>
    <section class="brain-controls" aria-label="Analysis controls">
      <div><label for="dataset">Study</label><select id="dataset"></select></div>
      <div><label for="statistic">Brain map</label><select id="statistic" disabled><option value="mean">Mean prediction</option><option value="contrast">Difference from study mean</option></select></div>
      <div><label for="views">Cortical view</label><select id="views" disabled><option value="inferior">Inferior / ventral</option><option value="four">Lateral / medial</option><option value="all">All views</option></select></div>
    </section>
    <p id="brain-status" role="status" aria-live="polite">Loading predictions…</p>
    <div id="brain-workspace" hidden>
      <div class="analysis-layout">
        <aside class="field-panel" aria-label="Variables">
          <h2>Variables</h2>
          <input id="field-search" type="search" aria-label="Search variables" placeholder="Search">
          <div id="fields"></div>
        </aside>
        <section id="members-section" class="members-section" aria-labelledby="members-heading" hidden>
          <div class="members-heading"><h2 id="members-heading">Examples</h2><span id="member-range"></span></div>
          <div id="members" tabindex="0" role="region" aria-label="Example gallery"></div>
          <p id="members-empty" hidden>No examples in this group.</p>
        </section>
        <section class="brain-card" aria-label="Aggregated predictions">
          <div class="axis-shelves">
            <div><label for="x-axis">X</label><select id="x-axis"></select></div>
            <button id="swap-axes" type="button" aria-label="Swap X and Y axes">⇄</button>
            <div><label for="y-axis">Y</label><select id="y-axis"></select></div>
          </div>
          <div class="scale-row"><span id="scale-low"></span><div class="brain-color-scale" aria-label="Predicted response in model units"></div><span id="scale-high"></span><span id="sample-summary"></span></div>
          <div class="brain-grid-scroll" tabindex="0" role="region" aria-label="X and Y prediction grid">
            <table id="groups" class="brain-grid" aria-label="Aggregated predicted cortical responses"></table>
          </div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>
